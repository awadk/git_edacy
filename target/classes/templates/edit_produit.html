<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDACY</title>
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css}">
			<link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.2/css/all.min.css}">
</head>
<body>
	
		<div class="container pt-3">
			<div class="card">
			<div class="card-header bgcard">
				<h3 class="text float-start">Modifier Produit</h3>
			</div>
			<div class="card-body">
				<form th:object="${produit}" th:action="@{/produit/update/{id} (id=${produit.id})}" method="post">
					<div class="mb-3">
					  <label class="form-label">Nom</label>
					  <input type="text" class="form-control" th:field="*{nom}">
					</div>
					<div class="mb-3">
					  <label class="form-label">Quantité</label>
					  <input type="text" class="form-control" th:field="*{quantite}">
					</div>
					<div class="mb-3">
					  <label class="form-label">Prix</label>
					  <input type="text" class="form-control" th:field="*{prix}">
					</div>
					
					<div class="mb-3">
					  <input type="submit" class="btn btn-new" >
					</div>
				</form>
			</div>
		</div>
		</div>
		
		
		<script th:src="@{/js/sidebars.js}"></script>
		<script th:src="@{/webjars/bootstrap/5.3.1/js/bootstrap.bundle.min.js}"></script>
		<script th:src="@{/webjars/font-awesome/6.4.2/js/all.js}"></script>
	</body>
</html>
