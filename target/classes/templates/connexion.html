<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Agency - Start Bootstrap Theme</title>
         Favicon
      <link rel="icon" type="image/x-icon" th:href="@{assets/favicon.ico}" />
         Font Awesome icons (free version)

		<link rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css}">
		<link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.2/css/all.min.css}">

		<link rel="stylesheet" th:href="@{/css/main.css}">

		
    </head>
    <body>
		<section class="vh-100 gradient-custom ">
		  <div class="container py-5 h-100">
		    <div class="row d-flex justify-content-center align-items-center h-100">
		      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
		        <div class="card bg-dark text-white" style="border-radius: 1rem;">
		          <div class="card-body p-5 text-center">

		            <div class="mb-md-5 mt-md-4 pb-5">

		              <h2 class="fw-bold mb-2 text-uppercase">Login</h2>
		              <p class="text-white-50 mb-5">MERCI DE VOUS CONNECTER </p>
					  <form 
					          th:action="@{/login}"
					          method="post"
					          
					         >
		              <div data-mdb-input-init class="form-outline form-white mb-4">
		                <input type="email" id="typeEmailX" class="form-control form-control-lg" />
		                <label class="form-label" for="typeEmailX">Email</label>
		              </div>

		              <div data-mdb-input-init class="form-outline form-white mb-4">
		                <input type="password" id="typePasswordX" class="form-control form-control-lg" />
		                <label class="form-label" for="typePasswordX">Password</label>
		              </div>

		              <p class="small mb-5 pb-lg-2"><a class="text-white-50" href="#!">Forgot password?</a></p>
					 <div class="message" th:if="${param.error}">
					           Invalid Username or Password
					        </div>
					        <div class="message" th:if="${param.logout}">
					           Logout Successfuly
					        </div>
					        
		              <button data-mdb-button-init data-mdb-ripple-init class="btn btn-outline-light btn-lg px-5" type="submit">Login</button>
					  </form>
		              <div class="d-flex justify-content-center text-center mt-4 pt-1">
		                <a href="#!" class="text-white"><i class="fab fa-facebook-f fa-lg"></i></a>
		                <a href="#!" class="text-white"><i class="fab fa-twitter fa-lg mx-4 px-2"></i></a>
		                <a href="#!" class="text-white"><i class="fab fa-google fa-lg"></i></a>
		              </div>

		            </div>

		            <div>
		              <p class="mb-0">Don't have an account? <a href="#!" class="text-white-50 fw-bold">Sign Up</a>
		              </p>
		            </div>

		          </div>
		        </div>
		      </div>
		    </div>
		  </div>
		</section>
		<script th:src="@{/js/scripts.js}"></script>
		<script th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.bundle.min.js}"></script>
		<script th:src="@{/webjars/font-awesome/6.4.2/js/all.js}"></script>
    </body>
</html>
