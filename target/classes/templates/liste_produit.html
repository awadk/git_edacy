<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tontines AVEC</title>
	<link rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css}">
			<link rel="stylesheet" th:href="@{/webjars/font-awesome/6.4.2/css/all.min.css}">
</head>
<body>
	

		<div class="container pt-3">
			<div class="card">
			<div class="card-header bgcard">
				<h3 class="text ">Liste produits</h3>
				<a class="btn btn-new text float-end " th:href="@{/produit/nouveau}">
					<i class="fa-solid fa-circle-plus"></i>
					Nouveau</a>

			</div>
			<div class="card-body">
				<table class="table table-bordered tabcat">
  					<thead>
						<tr>
							<th>#</th>
							<th>Nom</th>
							<th>Quantité</th>
							<th>Prix</th>
							<th>Action</th>
						</tr>  
						<tbody class="">
							<tr th:each="p : ${produits}">
								<td>[[${pStat.index} + 1]]</td>
								<td>[[${p.nom}]]</td>
								<td>[[${p.quantite}]]</td>
								<td>[[${p.prix}]]</td>
								<td>
									<a th:href="@{/produit/modifier/{id} (id=${p.id})}">
										<i class="fa fa-solid fa-pen text-primary"></i></a>
									&nbsp;
									<a th:href="@{/produit/supprimer/{id} (id=${p.id})}">
										<i class="fa fa-solid fa-trash text-danger"></i></a>
									
								</td>
							</tr>
						</tbody>
					 </thead>
				</table>
				
			
			</div>
		</div>
	</div>

			</div>
		</div>
		
		</div>
		
		
		<script th:src="@{/webjars/bootstrap/5.1.3/js/bootstrap.bundle.min.js}"></script>
		<script th:src="@{/webjars/font-awesome/6.4.2/js/all.js}"></script>
	</body>
</html>
